[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swb"
version = "0.3.0"
description = "signal-cli WebSocket bridge and bot toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.3",
    "dbus-fast>=5.0.9,<5.1.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
swb-bridge = "swb.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 160
exclude = [".venv", ".vscode"]
indent-width = 4  # Same as autopep8 default

[tool.ruff.format]
quote-style = "double"  # Or "single" if you prefer
indent-style = "space"  # Use spaces instead of tabs
line-ending = "lf"  # Keep consistency
preview = true

[tool.ruff.lint]
select = ["E9", "F82"]  # Syntax errors + docstrings
extend-select = ["I"]

[tool.pyright]
exclude = ["**/__pycache__", "**/node_modules", "**/dist", "**/build", "**/venv", "**/.venv", "**/tests"]
reportMissingImports = "warning"
pythonVersion = "3.11"

[tool.bandit]
exclude_dirs = [".venv", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.10",
    "vulture>=2.14",
    "xenon>=0.9.3",
]
